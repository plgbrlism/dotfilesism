# ~~ core ~~
[core]
plugins = \
  animate \
  autostart \
  command \
  cube \
  decoration \
  expo \
  fast-switcher \
  fisheye \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  invert \
  move \
  oswitch \
  place \
  resize \
  session-lock \
  shortcuts-inhibit \
  switcher \
  vswitch \
  window-rules \
  wm-actions \
  wobbly \
  wrot \
  zoom

vwidth = 3
vheight = 3
close_top_view = <super> KEY_C
exit = <super> KEY_M
preferred_decoration_mode = server
force_preferred_decoration_mode = true

# ~~ appearance ~~ 
[decoration]
border_size = 5
title_height = 25
font = JetBrainsMono Nerd Font SemiBold
font_scale = 0.7
button_scale = 0.7
active_color = #9ba0c9ff
inactive_color = #292a2eff
font_color = #0f1536ff

# ~~ autostart ~~
[autostart]
autostart_wf_shell = false
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP=wayfire QT_QPA_PLATFORMTHEME=qt6ct XCURSOR_THEME=Twilight-cursors XCURSOR_SIZE=30
1_noctalia = noctalia
2_portal = systemctl --user start xdg-desktop-portal-gtk
3_kanshi = kanshi

# ~~ apps ~~
[command]
binding_terminal = <super> KEY_ENTER
command_terminal = ~/.local/bin/dispatch terminal
binding_file_manager = <super> KEY_E
command_file_manager = ~/.local/bin/dispatch file-manager
binding_terminal_fm = <super> KEY_Y
command_terminal_fm = ~/.local/bin/dispatch terminal-fm

# noctalia
binding_launcher = <super> KEY_R
command_launcher = noctalia msg panel-toggle launcher
binding_wallpaper = <super> KEY_W
command_wallpaper = noctalia msg panel-toggle wallpaper
binding_session = <super> KEY_ESC
command_session = noctalia msg panel-toggle session
binding_control_center = <super> KEY_SPACE
command_control_center = noctalia msg panel-toggle control-center
binding_window_switcher = <alt> KEY_TAB
command_window_switcher = noctalia msg window-switcher
binding_screenshot = KEY_PRINT
command_screenshot = noctalia msg screenshot-fullscreen
binding_screenshot_interactive = <shift> KEY_PRINT
command_screenshot_interactive = noctalia msg screenshot-region
binding_screenshot_pick = <alt> KEY_PRINT
command_screenshot_pick = noctalia msg screenshot-fullscreen pick

# hardware
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = pactl set-sink-volume @DEFAULT_SINK@ +5%
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = pactl set-sink-volume @DEFAULT_SINK@ -5%
binding_mute = KEY_MUTE
command_mute = pactl set-sink-mute @DEFAULT_SINK@ toggle
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = brightnessctl set +5%
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = brightnessctl set 5%-

[wm-actions]
toggle_fullscreen = <super> KEY_F

[vswitch]
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8
binding_9 = <super> KEY_9
binding_10 = <super> KEY_0
send_win_1 = <super> <shift> KEY_1
send_win_2 = <super> <shift> KEY_2
send_win_3 = <super> <shift> KEY_3
send_win_4 = <super> <shift> KEY_4
send_win_5 = <super> <shift> KEY_5
send_win_6 = <super> <shift> KEY_6
send_win_7 = <super> <shift> KEY_7
send_win_8 = <super> <shift> KEY_8
send_win_9 = <super> <shift> KEY_9
send_win_10 = <super> <shift> KEY_0

# ~~ windows ~~
[place]
mode = center

[expo]
toggle = <super> KEY_O

# ~~ touchpad 
[input]
xkb_layout = us
tap_to_click = true
disable_touchpad_while_typing = false
tap_and_drag = true
drag_lock = false
touchpad_scroll_speed = 0.9
cursor_theme = Twilight-cursors
cursor_size = 30

# ~~ mouse ~~
[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

# [alpha]
# modifier = <super> <alt>
