# general
mod_key = "super"
focus_follows_mouse = true
focus_placement = "center"
window_placement = "auto"

# autostart
autostart = [
    "dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=driftwm QT_QPA_PLATFORMTHEME",
    "systemctl --user start xdg-desktop-portal-gtk",
    "NOCTALIA_CONFIG_HOME=$HOME/.config/noctalia-drift NOCTALIA_STATE_HOME=$HOME/.local/state/noctalia-drift noctalia",
]

# environment
[env]
QT_QPA_PLATFORMTHEME = "qt6ct"

# input
[input.trackpad]
tap_to_click = true
disable_while_typing = false
natural_scroll = false

[navigation]
trackpad_speed = 1
auto_navigate_on_click = true

# decorations
[decorations]
default_mode = "minimal"
border_width = 0        
corner_radius = 12
shadow = true
blur = true
opacity = 0.8                   
opacity_focused = 1.0

[background]
type = "none"

[effects]
blur_radius = 2
blur_strength = 1.0
animation_speed = 0.5

[snap]
gap = 5.0
outer_gap = 0.0

# outputs/resolution
[[outputs]]
name = "eDP-1"
mode = "1366x768@60"
scale = 1.0
position = [0, 0]

[[outputs]]
name = "HDMI-A-1"
mode = "1366x768@59"
scale = 1.0
position = [1366, 0]

# mouse modifer
[mouse.on-window]
"mod+left"  = "move-window"
"mod+right" = "resize-window"

# keybindings
[keybindings]
# apps
"mod+return" = "exec ~/.local/bin/dispatch terminal"
"mod+e"      = "exec ~/.local/bin/dispatch file-manager"
"mod+y"      = "exec ~/.local/bin/dispatch terminal-fm"
"mod+r"      = "spawn noctalia msg panel-toggle launcher"
"mod+w"      = "spawn noctalia msg panel-toggle wallpaper"
"mod+escape" = "spawn noctalia msg panel-toggle session"
"mod+space"  = "spawn noctalia msg panel-toggle control-center"
"alt+tab"    = "spawn noctalia msg window-switcher"

# window management
"mod+c" = "close-window"           
"mod+f" = "toggle-fullscreen"      
"mod+v" = "toggle-pin-to-screen"
"mod+g" = "fit-window"
"mod+m" = "quit"

"mod+shift+w" = "none"
"mod+o" = "zoom-to-fit-snapped"

# focus
"mod+h" = "focus-nearest left"
"mod+l" = "focus-nearest right"
"mod+k" = "focus-nearest up"
"mod+j" = "focus-nearest down"

# swap
"mod+shift+h" = "move-to-snap left"
"mod+shift+l" = "move-to-snap right"
"mod+shift+k" = "move-to-snap up"
"mod+shift+j" = "move-to-snap down"

# resize
"mod+ctrl+k" = "grow-window up"
"mod+ctrl+j" = "shrink-window down"
"mod+ctrl+l" = "grow-window right"
"mod+ctrl+h" = "shrink-window left"

[gestures.anywhere]
"3-finger-pinch" = "none"
"4-finger-pinch" = "zoom"

# explicit empty bookmark 
[navigation.bookmarks]

[session]
restore_bookmarks = false
